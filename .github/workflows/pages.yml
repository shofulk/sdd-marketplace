# Builds the marketplace catalog (site/) from the plugin files and deploys it to GitHub Pages.
# Pages serves only / or /docs from a branch, so site/ is deployed by Actions (spec §3.8).
name: Catalog to Pages

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci
      # build = build-catalog (fails on a CHANGELOG/plugin.json version mismatch) → tsc → vite build
      - name: Build the catalog and the site
        run: npm run build
      - name: Test
        run: npm test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
